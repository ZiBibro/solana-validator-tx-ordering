[package]
name = "itb-probe"
version = "0.1.0"
edition = "2021"
# Agave v4.3.2 pins the same toolchain (rust-toolchain.toml); the build image matches it.
rust-version = "1.97.1"
license = "MIT"
publish = false

[[bin]]
name = "itb-probe"
path = "src/main.rs"

[dependencies]
# QUIC stack of Agave v4.3.2: the quinn fork it pins exactly (Cargo.toml, line 316) and its
# TLS helpers, which give the client certificate the TPU server requires (plan, section 5.1).
quinn = { package = "anza-quinn", version = "=0.11.11-rustsec20260339" }
solana-tls-utils = { version = "=4.3.2", features = ["agave-unstable-api"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
x509-parser = "0.18"
webpki-roots = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Signing and payer derivation (section 11).
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
# JSON-RPC over HTTPS and the slot clock over WebSocket.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the snapshot copy (section 11); already in the tree through tokio.
libc = "0.2"
